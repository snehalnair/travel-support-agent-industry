[project]
name = "tsa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Snehal Nair", email = "snnair@tripadvisor.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.1",
    "duckdb>=1.5.3",
    "en-core-web-sm",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pandera[pandas]>=0.31.1",
    "presidio-analyzer>=2.2.362",
]

[project.scripts]
tsa = "tsa:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
